<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UniQuest — Explore. Discover. Belong.</title>

    <!-- Google Font -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                🎓
            </div>

            <div class="logo-text">
                UniQuest
            </div>

        </div>

    </header>


    <!-- ================= HERO ================= -->

    <main class="hero">

        <!-- Background overlay -->
        <div class="hero-overlay"></div>


        <!-- Hero content -->

        <section class="hero-content">

            <h1>
                UniQuest
            </h1>


            <h2>
                Explore. Discover.
                <span>Belong.</span>
            </h2>


            <p class="hero-subtitle">
                Find your place. Shape your future.
            </p>


            <p class="hero-description">
                Discover colleges, explore courses, and experience
                campus life — all in one place.
            </p>


            <button
                class="start-button"
                id="startButton">

                <span>
                    Let's Get Started
                </span>

                <span class="arrow">
                    →
                </span>

            </button>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
